[project]
name = "blackbox-ci"
version = "3.2.0"
description = "Command-line client for the BlackBox API"
authors = [{name = "BlackBox Team", email = "feedback.bbs@ptsecurity.com"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "click>=8.2,<9",
    "httpx>=0.27,<1",
    "attrs>=22.2.0",
    "python-dateutil>=2.8.0,<3",
]

[project.scripts]
blackbox-ci = "blackbox_ci.blackbox_ci:main"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
ruff = "^0.6"
mypy = "^1.13"
poethepoet = "^0.21"
tox = "^4.18"
openapi-python-client = "^0.28"
pytest = "^9.0.3"
pytest-mock = "^3.15.1"
pytest-cov = "6.2.1"
coverage = "<=7.7.0"


[tool.poe.tasks]
ruff-lint = "ruff check blackbox_ci tests"
ruff-format = "ruff format blackbox_ci tests"
ruff-fix = "ruff check --fix-only blackbox_ci tests"
mypy = "mypy --strict blackbox_ci"

ci_ruff.ref = "ruff-lint --output-format=gitlab --output-file=gl-code-quality-report.json"

regen-client.shell = """
rm -rf blackbox_ci/generated
poetry run openapi-python-client generate \
    --path docs/openapi.yaml \
    --output-path blackbox_ci/generated \
    --meta none \
    --overwrite
"""

pretty = ["ruff-format", "ruff-fix"]
lint = ["ruff-lint", "mypy"]
ci_lint = ["ci_ruff", "mypy"]

[[tool.mypy.overrides]]
module = "blackbox_ci.generated.*"
ignore_errors = true

[tool.coverage.run]
source = ["blackbox_ci"]
omit = ["blackbox_ci/generated/*"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"