components:
  schemas:
    APIKeyInfoSchema:
      properties:
        name:
          type: string
        place:
          $ref: '#/components/schemas/ApiKeyPlace'
        successString:
          oneOf:
          - type: string
          - type: 'null'
        successUrl:
          type: string
        value:
          type: string
      required:
      - name
      - place
      - successUrl
      - value
      title: APIKeyInfoSchema
      type: object
    APIKeySchema:
      properties:
        name:
          minLength: 1
          type: string
